name: Everyone Medicines
description: >-
  Everyone Medicines is a therapeutics company listed in the Khosla Ventures
  portfolio under the Therapeutics category, where it is described as
  "individualized precision therapeutics." The company has no public developer
  or API surface as of July 2026. Its original web address,
  everyonemedicines.com, now issues a 301 redirect to www.eomeds.com, a domain
  registered through GoDaddy on 2024-05-11 that currently resolves to no DNS A
  record, so the site is dark and no page, documentation, or .well-known
  document can be retrieved. Probes of the package registries (npm, PyPI),
  GitHub organizations (everyonemedicines, eomeds), and the .well-known
  discovery surface all returned nothing. This profile is retained in the API
  Evangelist network as a venture-backed life-sciences lead; it carries probed
  domain-security data only and should be re-run once the company publishes a
  live site.
